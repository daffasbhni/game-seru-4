<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Laser Arena - Boss Battle</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; }
    body { background: #000; color: #fff; font-family: sans-serif; overflow: hidden; }
    #canvas { display: block; background: #050505; }
    
    #ui { position: absolute; top: 15px; left: 15px; font-size: 16px; font-weight: bold; z-index: 5; text-shadow: 0 0 5px #fff; }
    #bossUI { display: none; position: absolute; top: 15px; right: 15px; font-size: 14px; text-align: right; z-index: 5; }
    .boss-bar { width: 150px; height: 12px; background: #333; border: 1px solid #ff4444; display: inline-block; vertical-align: middle; }
    .boss-fill { height: 100%; background: #ff4444; width: 100%; }

    #gameOverScreen { display: none; position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.9); color: #fff; flex-direction: column; align-items: center; justify-content: center; z-index: 20; }
    #gameOverScreen button { margin-top: 15px; padding: 12px 25px; font-size: 18px; font-weight: bold; background: #fff; color: #000; border: none; border-radius: 20px; cursor: pointer; }

    .controls { position: absolute; bottom: 20px; width: 100%; display: flex; justify-content: space-between; padding: 0 20px; z-index: 10; }
    .btn-group { display: flex; gap: 10px; }
    .btn { width: 55px; height: 55px; background: rgba(255,255,255,0.25); border: 2px solid #fff; border-radius: 50%; color: #fff; font-size: 20px; display: flex; align-items: center; justify-content: center; user-select: none; }
    .btn:active { background: rgba(255,255,255,0.6); }
  </style>
</head>
<body>

  <div id="ui">HP: <span id="hpText">100</span> | SCORE: <span id="scoreText">0</span></div>
  
  <div id="bossUI">
    BOSS: <div class="boss-bar"><div id="bossFill" class="boss-fill"></div></div>
  </div>

  <div id="gameOverScreen">
    <h1>GAME OVER</h1>
    <p>Skor Kamu: <span id="finalScore">0</span></p>
    <button onclick="resetGame()">MAIN LAGI</button>
  </div>

  <canvas id="canvas"></canvas>

  <div class="controls">
    <div class="btn-group">
      <div class="btn" id="btnLeft">◄</div>
      <div class="btn" id="btnRight">►</div>
      <div class="btn" id="btnJump">▲</div>
    </div>
    <div class="btn-group">
      <div class="btn" id="btnAim">↗</div>
      <div class="btn" id="btnLaser">⚡</div>
    </div>
  </div>

  <script>
    const cvs = document.getElementById('canvas');
    const ctx = cvs.getContext('2d');

    cvs.width = window.innerWidth;
    cvs.height = window.innerHeight;

    const floor = cvs.height - 60;
    let isGameOver = false;

    // Player (MC)
    const player = {
      x: 80, y: floor - 45, w: 30, h: 45,
      vx: 0, vy: 0, speed: 4, jump: -11,
      grounded: true, hp: 100, maxHp: 100, score: 0, dir: 1
    };

    const input = { left: false, right: false, aimUp: false };
    let playerLasers = [];
    let bossAttacks = [];
    let monsterList = [];
    let bossMonster = null;

    // Control Touch
    function attachControl(id, onPress, onRelease) {
      const el = document.getElementById(id);
      el.addEventListener('touchstart', (e) => { e.preventDefault(); onPress(); });
      el.addEventListener('touchend', (e) => { e.preventDefault(); if(onRelease) onRelease(); });
      el.addEventListener('mousedown', (e) => { e.preventDefault(); onPress(); });
      el.addEventListener('mouseup', (e) => { e.preventDefault(); if(onRelease) onRelease(); });
    }

    attachControl('btnLeft', () => { input.left = true; player.dir = -1; }, () => input.left = false);
    attachControl('btnRight', () => { input.right = true; player.dir = 1; }, () => input.right = false);
    attachControl('btnJump', () => { if(player.grounded) { player.vy = player.jump; player.grounded = false; } });
    attachControl('btnAim', () => input.aimUp = true, () => input.aimUp = false);
    attachControl('btnLaser', () => fireLaser());

    // Keyboard
    window.addEventListener('keydown', e => {
      if (isGameOver) return;
      if (e.key === 'a' || e.key === 'ArrowLeft') { input.left = true; player.dir = -1; }
      if (e.key === 'd' || e.key === 'ArrowRight') { input.right = true; player.dir = 1; }
      if (e.key === 'w' || e.key === 'ArrowUp') { if(player.grounded) { player.vy = player.jump; player.grounded = false; } }
      if (e.key === 'Shift') input.aimUp = true;
      if (e.key === ' ' || e.key === 'j') fireLaser();
    });

    window.addEventListener('keyup', e => {
      if (e.key === 'a' || e.key === 'ArrowLeft') input.left = false;
      if (e.key === 'd' || e.key === 'ArrowRight') input.right = false;
      if (e.key === 'Shift') input.aimUp = false;
    });

    // LASER BEAM PEMAIN (Glow Beam)
    function fireLaser() {
      if (isGameOver) return;
      
      let speedX = player.dir * 22;
      let speedY = input.aimUp ? -15 : 0;
      if (input.aimUp) speedX = player.dir * 14;

      playerLasers.push({
        x: player.x + player.w / 2,
        y: player.y + 15,
        vx: speedX,
        vy: speedY,
        length: 120, // Panjang Laser
        thick: 8     // Tebal Laser
      });
    }

    function spawnLogic() {
      // Monster Biasa
      if (!bossMonster && Math.random() < 0.01) {
        monsterList.push({
          x: cvs.width + 10,
          y: floor - 30,
          w: 30, h: 30,
          speed: 1.5,
          hp: 30
        });
      }

      // Spawn Boss Aktif di Skor 50
      if (player.score >= 50 && !bossMonster) {
        bossMonster = {
          x: cvs.width - 120,
          y: floor - 100,
          w: 90, h: 90,
          hp: 200, maxHp: 200,
          shootTimer: 0,
          angle: 0
        };
        document.getElementById('bossUI').style.display = 'block';
      }
    }

    function resetGame() {
      isGameOver = false;
      player.hp = 100;
      player.score = 0;
      player.x = 80;
      player.y = floor - player.h;
      playerLasers = [];
      bossAttacks = [];
      monsterList = [];
      bossMonster = null;
      document.getElementById('bossUI').style.display = 'none';
      document.getElementById('gameOverScreen').style.display = 'none';
      gameLoop();
    }

    function update() {
      if (isGameOver) return;

      // MOMENTUM PLAYER (Gerak Hanya Pas Ditekan)
      player.vx = 0;
      if (input.left) player.vx = -player.speed;
      if (input.right) player.vx = player.speed;

      player.vy += 0.55;
      player.x += player.vx;
      player.y += player.vy;

      if (player.y + player.h >= floor) {
        player.y = floor - player.h;
        player.vy = 0;
        player.grounded = true;
      }

      if (player.x < 0) player.x = 0;
      if (player.x + player.w > cvs.width) player.x = cvs.width - player.w;

      // Update Laser Pemain
      playerLasers.forEach((laser, index) => {
        laser.x += laser.vx;
        laser.y += laser.vy;
        if (laser.x > cvs.width || laser.x < -150 || laser.y < -150) {
          playerLasers.splice(index, 1);
        }
      });

      // Update Laser/Serangan Boss
      bossAttacks.forEach((atk, index) => {
        atk.x += atk.vx;
        atk.y += atk.vy;

        // Hit Player
        if (atk.x > player.x && atk.x < player.x + player.w &&
            atk.y > player.y && atk.y < player.y + player.h) {
          player.hp -= 15;
          bossAttacks.splice(index, 1);
        } else if (atk.x < 0 || atk.y > cvs.height) {
          bossAttacks.splice(index, 1);
        }
      });

      spawnLogic();

      // Monster Kroco
      monsterList.forEach((mon, mIdx) => {
        mon.x -= mon.speed;

        // Hit dengan Laser
        playerLasers.forEach((laser, lIdx) => {
          if (laser.x + laser.length > mon.x &&
              laser.x < mon.x + mon.w &&
              laser.y + laser.thick > mon.y &&
              laser.y < mon.y + mon.h) {
            
            mon.hp -= 30;
            playerLasers.splice(lIdx, 1);

            if (mon.hp <= 0) {
              monsterList.splice(mIdx, 1);
              player.score += 10;
            }
          }
        });

        if (player.x < mon.x + mon.w && player.x + player.w > mon.x &&
            player.y < mon.y + mon.h && player.y + player.h > mon.y) {
          player.hp -= 0.5;
        }
      });

      // Boss Logic (Bergerak & Nyerang!)
      if (bossMonster) {
        bossMonster.angle += 0.05;
        bossMonster.y = (floor - 110) + Math.sin(bossMonster.angle) * 30; // Melayang NAIK-TURUN

        // Boss Nembak Tiap Beberapa Detik
        bossMonster.shootTimer++;
        if (bossMonster.shootTimer > 80) { // Frekuensi nembak
          bossMonster.shootTimer = 0;

          // Arah tembakan mengincar posisi MC
          let dx = (player.x + player.w/2) - bossMonster.x;
          let dy = (player.y + player.h/2) - bossMonster.y;
          let dist = Math.sqrt(dx*dx + dy*dy);

          bossAttacks.push({
            x: bossMonster.x,
            y: bossMonster.y + bossMonster.h/2,
            vx: (dx / dist) * 7,
            vy: (dy / dist) * 7,
            size: 10
          });
        }

        // Kena Laser Pemain
        playerLasers.forEach((laser, lIdx) => {
          if (laser.x + laser.length > bossMonster.x &&
              laser.x < bossMonster.x + bossMonster.w &&
              laser.y + laser.thick > bossMonster.y &&
              laser.y < bossMonster.y + bossMonster.h) {
            
            bossMonster.hp -= 6;
            playerLasers.splice(lIdx, 1);

            if (bossMonster.hp <= 0) {
              bossMonster = null;
              player.score += 100;
              document.getElementById('bossUI').style.display = 'none';
            }
          }
        });

        if (bossMonster) {
          document.getElementById('bossFill').style.width = (bossMonster.hp / bossMonster.maxHp * 100) + '%';
        }
      }

      // Game Over Check
      if (player.hp <= 0) {
        player.hp = 0;
        isGameOver = true;
        document.getElementById('finalScore').innerText = player.score;
        document.getElementById('gameOverScreen').style.display = 'flex';
      }

      document.getElementById('hpText').innerText = Math.ceil(player.hp);
      document.getElementById('scoreText').innerText = player.score;
    }

    function render() {
      ctx.clearRect(0, 0, cvs.width, cvs.height);

      // Floor
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, floor);
      ctx.lineTo(cvs.width, floor);
      ctx.stroke();

      // MC Jubah Silver
      ctx.fillStyle = '#e0e0e0';
      ctx.beginPath();
      ctx.arc(player.x + player.w/2, player.y + 10, 7, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(player.x + player.w/2, player.y + 14);
      ctx.lineTo(player.x, player.y + player.h);
      ctx.lineTo(player.x + player.w, player.y + player.h);
      ctx.fill();

      // EFEK LASER PEMAIN (Laser Neon Glow)
      playerLasers.forEach(laser => {
        ctx.save();
        ctx.shadowBlur = 15;
        ctx.shadowColor = '#00ffff'; // Glow Biru Cyan
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(laser.x, laser.y, laser.length, laser.thick);
        ctx.restore();
      });

      // EFEK TEMBAKAN BOSS (Peluru/Laser Merah Menyala)
      bossAttacks.forEach(atk => {
        ctx.save();
        ctx.shadowBlur = 12;
        ctx.shadowColor = '#ff0000';
        ctx.fillStyle = '#ff4444';
        ctx.beginPath();
        ctx.arc(atk.x, atk.y, atk.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });

      // Monster Kroco
      ctx.fillStyle = '#777';
      monsterList.forEach(mon => {
        ctx.fillRect(mon.x, mon.y, mon.w, mon.h);
      });

      // Boss Besar + Tanduk
      if (bossMonster) {
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(bossMonster.x, bossMonster.y, bossMonster.w, bossMonster.h);

        ctx.beginPath();
        ctx.moveTo(bossMonster.x, bossMonster.y);
        ctx.lineTo(bossMonster.x - 20, bossMonster.y - 25);
        ctx.lineTo(bossMonster.x + 25, bossMonster.y);
        ctx.fill();
      }
    }

    function gameLoop() {
      update();
      render();
      if (!isGameOver) requestAnimationFrame(gameLoop);
    }

    gameLoop();
  </script>
</body>
</html>
