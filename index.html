<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Narrow Dark Cave - Fixed Boss & Layout</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: sans-serif; color: #fff; }

    /* Layout Utama Berbasis Flexbox Portrait */
    #mainLayout {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
    }

    /* Area Game Atas */
    #gameArea {
      position: relative;
      width: 100%;
      height: 60vh;
      background: #080808;
      border-bottom: 2px solid #ffffff;
      overflow: hidden;
    }

    #canvas { display: block; width: 100%; height: 100%; }

    /* Area Kontrol Bawah (Terpisah Dari Arena Game) */
    #controlArea {
      width: 100%;
      height: 40vh;
      background: #000000;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
    }

    /* Interface HP & Skor Khas Narrow Dark Cave */
    #topUI {
      position: absolute; top: 10px; left: 10px; right: 10px;
      display: flex; justify-content: space-between; align-items: center;
      z-index: 10; pointer-events: none;
    }

    .hp-segments { display: flex; gap: 3px; border: 2px solid #fff; padding: 2px; background: rgba(0,0,0,0.7); }
    .hp-block { width: 12px; height: 10px; background: #fff; }
    .hp-block.empty { background: #222; }

    .center-info { display: flex; align-items: center; gap: 6px; }
    .skull-icon { font-size: 18px; }
    .boss-hp-bar { width: 120px; height: 10px; background: #222; border: 1.5px solid #fff; display: none; overflow: hidden; }
    .boss-hp-fill { height: 100%; background: #fff; width: 100%; transition: width 0.05s linear; }

    .score-txt { font-size: 14px; font-weight: bold; font-family: monospace; }

    /* Game Over & Victory Overlay */
    #overlayScreen {
      display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85); flex-direction: column; justify-content: center;
      align-items: center; z-index: 20; text-align: center;
    }
    #overlayScreen h1 { font-size: 28px; margin-bottom: 8px; text-shadow: 0 0 10px #fff; }
    #overlayScreen button {
      margin-top: 15px; padding: 10px 25px; font-size: 14px; font-weight: bold;
      background: #fff; color: #000; border: none; border-radius: 4px; cursor: pointer;
    }

    /* Tombol-Tombol Joystick */
    .btn-group { display: flex; gap: 10px; }
    .btn {
      width: 54px; height: 54px; background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.7);
      border-radius: 50%; color: #fff; font-size: 20px; display: flex; align-items: center; justify-content: center;
      user-select: none; -webkit-tap-highlight-color: transparent;
    }
    .btn:active { background: rgba(255,255,255,0.5); transform: scale(0.92); }
  </style>
</head>
<body>

  <div id="mainLayout">
    <!-- Area Layar Permainan Atas -->
    <div id="gameArea">
      <div id="topUI">
        <div class="hp-segments" id="hpSegments">
          <div class="hp-block"></div><div class="hp-block"></div><div class="hp-block"></div>
          <div class="hp-block"></div><div class="hp-block"></div><div class="hp-block"></div>
        </div>

        <div class="center-info">
          <span class="skull-icon">💀</span>
          <div class="boss-hp-bar" id="bossBar"><div class="boss-hp-fill" id="bossFill"></div></div>
        </div>

        <div class="score-txt">SCORE: <span id="scoreVal">0</span></div>
      </div>

      <div id="overlayScreen">
        <h1 id="overlayTitle">GAME OVER</h1>
        <p>Skor Akhir: <span id="finalScore">0</span></p>
        <button onclick="resetGame()">MAIN LAGI</button>
      </div>

      <canvas id="canvas"></canvas>
    </div>

    <!-- Area Kontrol Tombol Bawah -->
    <div id="controlArea">
      <div class="btn-group">
        <div class="btn" id="btnLeft">◄</div>
        <div class="btn" id="btnRight">►</div>
        <div class="btn" id="btnJump">▲</div>
      </div>
      <div class="btn-group">
        <div class="btn" id="btnAim">↗</div>
        <div class="btn" id="btnLaser">⚡</div>
      </div>
    </div>
  </div>

  <script>
    const gameArea = document.getElementById('gameArea');
    const cvs = document.getElementById('canvas');
    const ctx = cvs.getContext('2d');

    function syncCanvasSize() {
      cvs.width = gameArea.clientWidth;
      cvs.height = gameArea.clientHeight;
    }
    syncCanvasSize();
    window.addEventListener('resize', syncCanvasSize);

    let floorY = cvs.height - 30;
    let isGameOver = false;

    // Status Karakter Utama
    const player = {
      x: 40, y: 0, w: 20, h: 35,
      vx: 0, vy: 0, speed: 3.5, jump: -10.5,
      grounded: true, hp: 6, maxHp: 6, score: 0, dir: 1
    };

    const input = { left: false, right: false, aimUp: false };
    let activeLaser = null;
    let bossAttacks = [];
    let monsters = [];
    let boss = null;
    let particles = [];

    // Pengikat Input Tombol Touch & Mouse
    function setupButton(id, onPress, onRelease) {
      const el = document.getElementById(id);
      el.addEventListener('touchstart', (e) => { e.preventDefault(); onPress(); });
      el.addEventListener('touchend', (e) => { e.preventDefault(); if(onRelease) onRelease(); });
      el.addEventListener('mousedown', (e) => { e.preventDefault(); onPress(); });
      el.addEventListener('mouseup', (e) => { e.preventDefault(); if(onRelease) onRelease(); });
    }

    setupButton('btnLeft', () => { input.left = true; player.dir = -1; }, () => input.left = false);
    setupButton('btnRight', () => { input.right = true; player.dir = 1; }, () => input.right = false);
    setupButton('btnJump', () => { if(player.grounded) { player.vy = player.jump; player.grounded = false; } });
    setupButton('btnAim', () => input.aimUp = true, () => input.aimUp = false);
    setupButton('btnLaser', () => shootLaser());

    // FUNGSI UTAMA TEMBAKAN LASER
    function shootLaser() {
      if (isGameOver) return;

      const angle = input.aimUp ? (player.dir > 0 ? -Math.PI / 4 : -Math.PI * 0.75) : (player.dir > 0 ? 0 : Math.PI);
      
      activeLaser = {
        x: player.x + player.w / 2,
        y: player.y + 12,
        angle: angle,
        timer: 10,
        dirX: player.dir,
        aimUp: input.aimUp
      };

      // Efek Percikan Partikel di Senjata
      for(let i = 0; i < 12; i++) {
        particles.push({
          x: activeLaser.x, y: activeLaser.y,
          vx: (Math.random() - 0.5) * 8, vy: (Math.random() - 0.5) * 8,
          life: 8, color: '#ffffff'
        });
      }
    }

    // SPAWN ENEMIES & BOSS
    function handleSpawns() {
      // Monster Biasa
      if (!boss && Math.random() < 0.015) {
        monsters.push({
          x: cvs.width + 10,
          y: cvs.height - 30 - 22,
          w: 22, h: 22, speed: 1.8, hp: 10
        });
      }

      // Boss Muncul Saat Skor Mencapai 30
      if (player.score >= 30 && !boss) {
        boss = {
          x: cvs.width - 80,
          y: cvs.height - 30 - 70,
          w: 60, h: 60,
          hp: 60, maxHp: 60, // Total HP disesuaikan
          timer: 0, angle: 0, hitFlash: 0
        };
        document.getElementById('bossBar').style.display = 'block';
      }
    }

    // PEMERIKSAAN TABRAKAN LASER DENGAN OBJEK (RAYCASTING)
    function isLaserHitting(target) {
      if (!activeLaser) return false;

      let lx = activeLaser.x;
      let ly = activeLaser.y;
      let dir = activeLaser.dirX;
      let aimUp = activeLaser.aimUp;

      // Cek Arah Sumbu X
      if (dir > 0 && target.x + target.w < lx) return false;
      if (dir < 0 && target.x > lx) return false;

      // Cek Sumbu Y Berdasarkan Sudut Laser
      let targetCenterY = target.y + target.h / 2;
      let calculatedY = ly;

      if (aimUp) {
        let distanceX = Math.abs(target.x - lx);
        calculatedY = ly - distanceX * 0.8;
      }

      return Math.abs(targetCenterY - calculatedY) < (target.h / 2 + 20);
    }

    function resetGame() {
      isGameOver = false;
      player.hp = 6;
      player.score = 0;
      player.x = 40;
      monsters = [];
      bossAttacks = [];
      boss = null;
      activeLaser = null;
      particles = [];
      document.getElementById('bossBar').style.display = 'none';
      document.getElementById('overlayScreen').style.display = 'none';
      loop();
    }

    function update() {
      if (isGameOver) return;

      floorY = cvs.height - 30;

      // Pergerakan Player
      player.vx = 0;
      if (input.left) player.vx = -player.speed;
      if (input.right) player.vx = player.speed;

      player.vy += 0.55;
      player.x += player.vx;
      player.y += player.vy;

      if (player.y + player.h >= floorY) {
        player.y = floorY - player.h;
        player.vy = 0;
        player.grounded = true;
      }

      if (player.x < 0) player.x = 0;
      if (player.x + player.w > cvs.width) player.x = cvs.width - player.w;

      // Update Partikel
      particles.forEach((p, idx) => {
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        if(p.life <= 0) particles.splice(idx, 1);
      });

      handleSpawns();

      // KERUSAKAN DARI LASER KE MUSUH DAN BOSS
      if (activeLaser) {
        activeLaser.timer--;

        // Kerusakan ke Monster Biasa
        for (let i = monsters.length - 1; i >= 0; i--) {
          if (isLaserHitting(monsters[i])) {
            monsters.splice(i, 1);
            player.score += 10;
          }
        }

        // Kerusakan ke Boss Utama
        if (boss && isLaserHitting(boss)) {
          boss.hp -= 3; // Mengurangi HP Boss secara signifikan
          boss.hitFlash = 2;

          // LOGIKA MATI BOSS
          if (boss.hp <= 0) {
            boss.hp = 0;
            // Partikel Ledakan Kematian Boss
            for (let b = 0; b < 30; b++) {
              particles.push({
                x: boss.x + boss.w / 2, y: boss.y + boss.h / 2,
                vx: (Math.random() - 0.5) * 12, vy: (Math.random() - 0.5) * 12,
                life: 20, color: '#ffffff'
              });
            }
            boss = null; // Menghapus Objek Boss Dari Memori Game
            player.score += 100;
            document.getElementById('bossBar').style.display = 'none';
          }
        }

        if (activeLaser && activeLaser.timer <= 0) activeLaser = null;
      }

      // Pergerakan Monster Biasa
      monsters.forEach((m, idx) => {
        m.x -= m.speed;
        if (player.x < m.x + m.w && player.x + player.w > m.x &&
            player.y < m.y + m.h && player.y + player.h > m.y) {
          player.hp -= 1;
          monsters.splice(idx, 1);
        }
      });

      // Logika & Serangan Boss
      if (boss) {
        if (boss.hitFlash > 0) boss.hitFlash--;

        boss.angle += 0.05;
        boss.y = (floorY - 80) + Math.sin(boss.angle) * 18;

        boss.timer++;
        if (boss.timer > 75) {
          boss.timer = 0;
          let dx = (player.x + player.w / 2) - (boss.x + boss.w / 2);
          let dy = (player.y + player.h / 2) - (boss.y + boss.h / 2);
          let dist = Math.sqrt(dx * dx + dy * dy);

          bossAttacks.push({
            x: boss.x + boss.w / 2,
            y: boss.y + boss.h / 2,
            vx: (dx / dist) * 5,
            vy: (dy / dist) * 5
          });
        }

        const percentage = Math.max(0, (boss.hp / boss.maxHp) * 100);
        document.getElementById('bossFill').style.width = percentage + '%';
      }

      // Pergerakan Serangan Boss
      bossAttacks.forEach((atk, idx) => {
        atk.x += atk.vx;
        atk.y += atk.vy;

        if (atk.x > player.x && atk.x < player.x + player.w &&
            atk.y > player.y && atk.y < player.y + player.h) {
          player.hp -= 1;
          bossAttacks.splice(idx, 1);
        }
      });

      // Update UI Tampilan Darah Player
      const hpBlocks = document.querySelectorAll('#hpSegments .hp-block');
      hpBlocks.forEach((blk, idx) => {
        if (idx < player.hp) blk.classList.remove('empty');
        else blk.classList.add('empty');
      });

      document.getElementById('scoreVal').innerText = player.score;

      // Penanganan Game Over Player
      if (player.hp <= 0) {
        player.hp = 0;
        isGameOver = true;
        document.getElementById('overlayTitle').innerText = "GAME OVER";
        document.getElementById('finalScore').innerText = player.score;
        document.getElementById('overlayScreen').style.display = 'flex';
      }
    }

    function render() {
      ctx.clearRect(0, 0, cvs.width, cvs.height);

      // Garis Lantai Arena
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(0, floorY);
      ctx.lineTo(cvs.width, floorY);
      ctx.stroke();

      // Gambar Karakter Player (Minimalis Silhouette)
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(player.x + player.w / 2, player.y + 6, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(player.x + player.w / 2, player.y + 10);
      ctx.lineTo(player.x - 2, player.y + player.h);
      ctx.lineTo(player.x + player.w + 2, player.y + player.h);
      ctx.fill();

      // Gambar Visual Laser
      if (activeLaser) {
        let lx = activeLaser.x;
        let ly = activeLaser.y;
        let angle = activeLaser.angle;
        let endX = lx + Math.cos(angle) * cvs.width * 2;
        let endY = ly + Math.sin(angle) * cvs.width * 2;

        ctx.save();
        ctx.shadowBlur = 15;
        ctx.shadowColor = '#ffffff';

        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 8;
        ctx.beginPath();
        ctx.moveTo(lx, ly);
        ctx.lineTo(endX, endY);
        ctx.stroke();

        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(lx, ly, 8, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }

      // Gambar Partikel
      particles.forEach(p => {
        ctx.fillStyle = p.color || '#ffffff';
        ctx.fillRect(p.x, p.y, 3, 3);
      });

      // Gambar Monster Biasa
      ctx.fillStyle = '#aaaaaa';
      monsters.forEach(m => ctx.fillRect(m.x, m.y, m.w, m.h));

      // Gambar Boss
      if (boss) {
        ctx.fillStyle = (boss.hitFlash > 0) ? '#ffffff' : '#dddddd';
        ctx.fillRect(boss.x, boss.y, boss.w, boss.h);

        // Tanduk Boss
        ctx.beginPath();
        ctx.moveTo(boss.x + 8, boss.y);
        ctx.lineTo(boss.x - 10, boss.y - 18);
        ctx.lineTo(boss.x + 20, boss.y);
        ctx.fill();
      }

      // Gambar Peluru Boss
      ctx.fillStyle = '#ffffff';
      bossAttacks.forEach(atk => {
        ctx.beginPath();
        ctx.arc(atk.x, atk.y, 5, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    function loop() {
      update();
      render();
      if (!isGameOver) requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
