<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Dark Cave Arena</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; }
    body { background: #0a0a0a; color: #fff; font-family: sans-serif; overflow: hidden; }
    #canvas { display: block; background: #0a0a0a; }
    #ui { position: absolute; top: 10px; left: 10px; font-size: 16px; font-weight: bold; z-index: 5; }
    #overlay { display: none; position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.8); color: #fff; flex-direction: column; align-items: center; justify-content: center; z-index: 10; }
    #overlay button { margin-top: 15px; padding: 10px 20px; font-size: 16px; cursor: pointer; }
    .controls { position: absolute; bottom: 15px; width: 100%; display: flex; justify-content: space-between; padding: 0 15px; z-index: 5; }
    .btn { width: 50px; height: 50px; background: rgba(255,255,255,0.2); border: 2px solid #fff; border-radius: 50%; color: #fff; font-size: 18px; display: flex; align-items: center; justify-content: center; user-select: none; }
    .btn:active { background: rgba(255,255,255,0.6); }
    .group { display: flex; gap: 8px; }
  </style>
</head>
<body>

  <div id="ui">HP: <span id="hp">100</span> | SCORE: <span id="score">0</span></div>

  <div id="overlay">
    <h1>GAME OVER</h1>
    <button onclick="resetGame()">MAIN LAGI</button>
  </div>

  <canvas id="canvas"></canvas>

  <div class="controls">
    <div class="group">
      <div class="btn" id="bLeft">◄</div>
      <div class="btn" id="bRight">►</div>
      <div class="btn" id="bJump">▲</div>
    </div>
    <div class="group">
      <div class="btn" id="bAim">↗</div>
      <div class="btn" id="bAtk">⚡</div>
    </div>
  </div>

  <script>
    const cvs = document.getElementById('canvas');
    const ctx = cvs.getContext('2d');
    
    cvs.width = window.innerWidth;
    cvs.height = window.innerHeight;

    const floor = cvs.height - 60;
    let gameOver = false;

    // Player (MC)
    const mc = {
      x: 80, y: floor - 40, w: 25, h: 40,
      vx: 0, vy: 0, speed: 3, jump: -10,
      grounded: true, hp: 100, score: 0, dir: 1
    };

    const keys = { left: false, right: false, aim: false };
    let lasers = [];
    let monsters = [];
    let boss = null;

    // Controls Event
    function bindBtn(id, press, release) {
      const el = document.getElementById(id);
      el.addEventListener('touchstart', (e) => { e.preventDefault(); press(); });
      el.addEventListener('touchend', (e) => { e.preventDefault(); if(release) release(); });
      el.addEventListener('mousedown', (e) => { e.preventDefault(); press(); });
      el.addEventListener('mouseup', (e) => { e.preventDefault(); if(release) release(); });
    }

    bindBtn('bLeft', () => { keys.left = true; mc.dir = -1; }, () => keys.left = false);
    bindBtn('bRight', () => { keys.right = true; mc.dir = 1; }, () => keys.right = false);
    bindBtn('bJump', () => { if(mc.grounded) { mc.vy = mc.jump; mc.grounded = false; } });
    bindBtn('bAim', () => keys.aim = true, () => keys.aim = false);
    bindBtn('bAtk', () => shoot());

    // Keyboard Fallback
    window.addEventListener('keydown', e => {
      if(e.key === 'a' || e.key === 'ArrowLeft') { keys.left = true; mc.dir = -1; }
      if(e.key === 'd' || e.key === 'ArrowRight') { keys.right = true; mc.dir = 1; }
      if(e.key === 'w' || e.key === 'ArrowUp') { if(mc.grounded) { mc.vy = mc.jump; mc.grounded = false; } }
      if(e.key === 'Shift') keys.aim = true;
      if(e.key === ' ' || e.key === 'j') shoot();
    });
    window.addEventListener('keyup', e => {
      if(e.key === 'a' || e.key === 'ArrowLeft') keys.left = false;
      if(e.key === 'd' || e.key === 'ArrowRight') keys.right = false;
      if(e.key === 'Shift') keys.aim = false;
    });

    function shoot() {
      if(gameOver) return;
      lasers.push({
        x: mc.x + mc.w/2,
        y: mc.y + 10,
        vx: keys.aim ? mc.dir * 10 : mc.dir * 14,
        vy: keys.aim ? -10 : 0
      });
    }

    function spawn() {
      // Monster Biasa (Sangat Sedikit)
      if(!boss && Math.random() < 0.008) {
        monsters.push({ x: cvs.width, y: floor - 25, w: 25, h: 25, hp: 20 });
      }
      // Boss Monster
      if(mc.score >= 50 && !boss) {
        boss = { x: cvs.width - 100, y: floor - 80, w: 80, h: 80, hp: 150, maxHp: 150 };
      }
    }

    function resetGame() {
      gameOver = false;
      mc.hp = 100;
      mc.score = 0;
      mc.x = 80;
      lasers = [];
      monsters = [];
      boss = null;
      document.getElementById('overlay').style.display = 'none';
      loop();
    }

    function update() {
      if(gameOver) return;

      // Player Movement (DIAM KALAU GAK DITEKAN)
      mc.vx = 0;
      if(keys.left) mc.vx = -mc.speed;
      if(keys.right) mc.vx = mc.speed;

      mc.vy += 0.5; // Gravity
      mc.x += mc.vx;
      mc.y += mc.vy;

      if(mc.y + mc.h >= floor) {
        mc.y = floor - mc.h;
        mc.vy = 0;
        mc.grounded = true;
      }

      // Lasers
      lasers.forEach((l, i) => {
        l.x += l.vx;
        l.y += l.vy;
        if(l.x > cvs.width || l.x < 0 || l.y < 0) lasers.splice(i, 1);
      });

      spawn();

      // Monsters Logic
      monsters.forEach((m, i) => {
        m.x -= 1.2;
        // Hit Laser
        lasers.forEach((l, li) => {
          if(l.x > m.x && l.x < m.x + m.w && l.y > m.y && l.y < m.y + m.h) {
            m.hp -= 10;
            lasers.splice(li, 1);
            if(m.hp <= 0) { monsters.splice(i, 1); mc.score += 10; }
          }
        });
        // Hit MC
        if(mc.x < m.x + m.w && mc.x + mc.w > m.x && mc.y < m.y + m.h && mc.y + mc.h > m.y) {
          mc.hp -= 0.5;
        }
      });

      // Boss Logic
      if(boss) {
        lasers.forEach((l, li) => {
          if(l.x > boss.x && l.x < boss.x + boss.w && l.y > boss.y && l.y < boss.y + boss.h) {
            boss.hp -= 5;
            lasers.splice(li, 1);
            if(boss.hp <= 0) { boss = null; mc.score += 100; }
          }
        });
      }

      // Game Over Check
      if(mc.hp <= 0) {
        mc.hp = 0;
        gameOver = true;
        document.getElementById('overlay').style.display = 'flex';
      }

      document.getElementById('hp').innerText = Math.ceil(mc.hp);
      document.getElementById('score').innerText = mc.score;
    }

    function draw() {
      ctx.clearRect(0, 0, cvs.width, cvs.height);

      // Floor
      ctx.strokeStyle = '#fff';
      ctx.beginPath();
      ctx.moveTo(0, floor);
      ctx.lineTo(cvs.width, floor);
      ctx.stroke();

      // MC (Jubah Silver)
      ctx.fillStyle = '#e0e0e0';
      ctx.beginPath();
      ctx.arc(mc.x + mc.w/2, mc.y + 8, 6, 0, Math.PI*2); // Kepala
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(mc.x + mc.w/2, mc.y + 12);
      ctx.lineTo(mc.x, mc.y + mc.h);
      ctx.lineTo(mc.x + mc.w, mc.y + mc.h);
      ctx.fill(); // Jubah

      // Lasers (Garis Panjang Menyala)
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 3;
      lasers.forEach(l => {
        ctx.beginPath();
        ctx.moveTo(l.x, l.y);
        ctx.lineTo(l.x - l.vx*2, l.y - l.vy*2);
        ctx.stroke();
      });

      // Monsters
      ctx.fillStyle = '#666';
      monsters.forEach(m => ctx.fillRect(m.x, m.y, m.w, m.h));

      // Boss
      if(boss) {
        ctx.fillStyle = '#fff';
        ctx.fillRect(boss.x, boss.y, boss.w, boss.h);
        // HP Bar Boss
        ctx.fillStyle = 'red';
        ctx.fillRect(boss.x, boss.y - 15, (boss.hp/boss.maxHp)*boss.w, 8);
      }
    }

    function loop() {
      update();
      draw();
      if(!gameOver) requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
