<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Narrow Dark Cave - Boss Fix</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: monospace; color: #fff; }

    #container { display: flex; flex-direction: column; width: 100vw; height: 100vh; }
    
    /* Area Game Atas */
    #gameBox { position: relative; width: 100%; height: 60vh; background: #080808; border-bottom: 2px solid #fff; }
    #canvas { display: block; width: 100%; height: 100%; }

    /* Area Control Bawah (Terpisah) */
    #controls { width: 100%; height: 40vh; background: #000; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; }

    /* UI Top */
    #ui { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; align-items: center; pointer-events: none; }
    .hp-box { display: flex; gap: 3px; border: 2px solid #fff; padding: 2px; }
    .hp-cell { width: 10px; height: 10px; background: #fff; }
    .hp-cell.off { background: #222; }

    .boss-ui { display: none; align-items: center; gap: 8px; }
    .boss-bar { width: 100px; height: 10px; border: 1px solid #fff; background: #222; }
    .boss-fill { width: 100%; height: 100%; background: #fff; }

    /* Buttons */
    .btn-group { display: flex; gap: 10px; }
    .btn { width: 55px; height: 55px; border: 2px solid #fff; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 20px; background: rgba(255,255,255,0.1); }
    .btn:active { background: #fff; color: #000; }

    #overlay { display: none; position: absolute; inset: 0; background: rgba(0,0,0,0.85); flex-direction: column; justify-content: center; align-items: center; }
    #overlay button { margin-top: 15px; padding: 10px 20px; background: #fff; border: none; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

  <div id="container">
    <div id="gameBox">
      <div id="ui">
        <div class="hp-box" id="playerHp">
          <div class="hp-cell"></div><div class="hp-cell"></div><div class="hp-cell"></div>
          <div class="hp-cell"></div><div class="hp-cell"></div><div class="hp-cell"></div>
        </div>
        <div class="boss-ui" id="bossUi">
          <span>💀 BOSS</span>
          <div class="boss-bar"><div class="boss-fill" id="bossFill"></div></div>
        </div>
        <div>SCORE: <span id="score">0</span></div>
      </div>

      <div id="overlay">
        <h1 id="overText">GAME OVER</h1>
        <button onclick="restart()">MAIN LAGI</button>
      </div>

      <canvas id="canvas"></canvas>
    </div>

    <div id="controls">
      <div class="btn-group">
        <div class="btn" id="bLeft">◄</div>
        <div class="btn" id="bRight">►</div>
        <div class="btn" id="bJump">▲</div>
      </div>
      <div class="btn-group">
        <div class="btn" id="bAim">↗</div>
        <div class="btn" id="bLaser">⚡</div>
      </div>
    </div>
  </div>

  <script>
    const gameBox = document.getElementById('gameBox');
    const cvs = document.getElementById('canvas');
    const ctx = cvs.getContext('2d');

    function resize() {
      cvs.width = gameBox.clientWidth;
      cvs.height = gameBox.clientHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    let floor = cvs.height - 20;
    let gameOver = false;

    // Player
    const player = {
      x: 30, y: 0, w: 20, h: 30,
      vx: 0, vy: 0, speed: 4, jump: -10,
      grounded: true, hp: 6, score: 0, dir: 1
    };

    const keys = { left: false, right: false, aim: false };
    let laser = null;
    let boss = null;
    let bossShots = [];

    // Touch Controls
    function setupBtn(id, press, release) {
      const el = document.getElementById(id);
      el.addEventListener('touchstart', (e) => { e.preventDefault(); press(); });
      el.addEventListener('touchend', (e) => { e.preventDefault(); if(release) release(); });
      el.addEventListener('mousedown', (e) => { e.preventDefault(); press(); });
      el.addEventListener('mouseup', (e) => { e.preventDefault(); if(release) release(); });
    }

    setupBtn('bLeft', () => { keys.left = true; player.dir = -1; }, () => keys.left = false);
    setupBtn('bRight', () => { keys.right = true; player.dir = 1; }, () => keys.right = false);
    setupBtn('bJump', () => { if(player.grounded) { player.vy = player.jump; player.grounded = false; } });
    setupBtn('bAim', () => keys.aim = true, () => keys.aim = false);
    setupBtn('bLaser', () => shoot());

    function shoot() {
      if (gameOver || laser) return; // Delay tembakan biarpun diklik berulang
      
      laser = {
        x: player.x + (player.dir > 0 ? player.w : 0),
        y: keys.aim ? player.y - 10 : player.y + 10,
        dir: player.dir,
        aim: keys.aim,
        timer: 8 // Frame aktif laser
      };
    }

    function spawnBoss() {
      if (!boss && player.score >= 20) { // Boss muncul pas skor 20
        boss = {
          x: cvs.width - 70,
          y: cvs.height - 100,
          w: 50, h: 50,
          hp: 30, // HP BOSS CUMA 30
          maxHp: 30,
          shootTimer: 0
        };
        document.getElementById('bossUi').style.display = 'flex';
      }
    }

    function restart() {
      gameOver = false;
      player.hp = 6;
      player.score = 0;
      player.x = 30;
      boss = null;
      laser = null;
      bossShots = [];
      document.getElementById('bossUi').style.display = 'none';
      document.getElementById('overlay').style.display = 'none';
      loop();
    }

    function update() {
      if (gameOver) return;

      floor = cvs.height - 20;

      // Gerak Player
      player.vx = 0;
      if (keys.left) player.vx = -player.speed;
      if (keys.right) player.vx = player.speed;

      player.vy += 0.5; // Gravitasi
      player.x += player.vx;
      player.y += player.vy;

      if (player.y + player.h >= floor) {
        player.y = floor - player.h;
        player.vy = 0;
        player.grounded = true;
      }

      // Cek Spawn Boss
      spawnBoss();

      // LOGIKA SERANGAN LASER BIKIN BOSS MATI
      if (laser) {
        laser.timer--;

        // Jika ada boss, cek apakah laser mengarah ke boss
        if (boss) {
          let hit = false;
          if (laser.dir > 0 && laser.x <= boss.x + boss.w) hit = true;
          if (laser.dir < 0 && laser.x >= boss.x) hit = true;

          if (hit) {
            boss.hp -= 10; // ONESHOT BERKURANG 10 HP! (3 kali tembak = MATI)
            
            // CEK MATI ABSOLUT
            if (boss.hp <= 0) {
              boss = null; // PAKSA HAPUS BOSS
              player.score += 100;
              document.getElementById('bossUi').style.display = 'none';
            }
          }
        }

        if (laser.timer <= 0) laser = null;
      }

      // Logika Serangan Boss
      if (boss) {
        boss.shootTimer++;
        if (boss.shootTimer > 90) { // Boss nembak tiap beberapa detik
          boss.shootTimer = 0;
          bossShots.push({ x: boss.x, y: boss.y + 20, vx: -4 });
        }

        // Update Bar HP Boss
        const percent = Math.max(0, (boss.hp / boss.maxHp) * 100);
        document.getElementById('bossFill').style.width = percent + '%';
      }

      // Peluru Boss
      for (let i = bossShots.length - 1; i >= 0; i--) {
        let s = bossShots[i];
        s.x += s.vx;

        // Kena Player
        if (s.x > player.x && s.x < player.x + player.w &&
            s.y > player.y && s.y < player.y + player.h) {
          player.hp--;
          bossShots.splice(i, 1);
        } else if (s.x < 0) {
          bossShots.splice(i, 1);
        }
      }

      // UI Player HP
      const cells = document.querySelectorAll('.hp-cell');
      cells.forEach((c, i) => {
        if (i < player.hp) c.classList.remove('off');
        else c.classList.add('off');
      });

      document.getElementById('score').innerText = player.score;

      if (player.hp <= 0) {
        gameOver = true;
        document.getElementById('overText').innerText = "GAME OVER";
        document.getElementById('overlay').style.display = 'flex';
      }
    }

    function render() {
      ctx.clearRect(0, 0, cvs.width, cvs.height);

      // Lantai
      ctx.strokeStyle = '#fff';
      ctx.beginPath();
      ctx.moveTo(0, floor);
      ctx.lineTo(cvs.width, floor);
      ctx.stroke();

      // Player
      ctx.fillStyle = '#fff';
      ctx.fillRect(player.x, player.y, player.w, player.h);

      // Laser
      if (laser) {
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.moveTo(laser.x, laser.y);
        ctx.lineTo(laser.dir > 0 ? cvs.width : 0, laser.aim ? 0 : laser.y);
        ctx.stroke();
      }

      // Boss
      if (boss) {
        ctx.fillStyle = '#fff';
        ctx.fillRect(boss.x, boss.y, boss.w, boss.h);
      }

      // Peluru Boss
      ctx.fillStyle = '#fff';
      bossShots.forEach(s => {
        ctx.fillRect(s.x, s.y, 6, 6);
      });
    }

    function loop() {
      update();
      render();
      if (!gameOver) requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
