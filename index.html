<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Dark Cave Arena</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; background-color: #0a0a0a; font-family: sans-serif; color: #fff; }
    #gameCanvas { display: block; width: 100vw; height: 100vh; background: #0a0a0a; }
    
    /* UI Overlay */
    .controls { position: absolute; bottom: 20px; width: 100%; display: flex; justify-content: space-between; padding: 0 20px; pointer-events: none; }
    .btn-group { display: flex; gap: 10px; pointer-events: auto; }
    .btn { width: 60px; height: 60px; background: rgba(255,255,255,0.15); border: 2px solid #fff; border-radius: 50%; color: #fff; font-size: 20px; font-weight: bold; display: flex; align-items: center; justify-content: center; user-select: none; }
    .btn:active { background: rgba(255,255,255,0.4); }
    #ui { position: absolute; top: 15px; left: 20px; font-size: 18px; pointer-events: none; text-shadow: 0 0 5px #fff; }
  </style>
</head>
<body>

  <div id="ui">HP: <span id="hp">100</span> | SCORE: <span id="score">0</span></div>
  <canvas id="gameCanvas"></canvas>

  <div class="controls">
    <div class="btn-group">
      <div class="btn" id="btnLeft">◄</div>
      <div class="btn" id="btnRight">►</div>
    </div>
    <div class="btn-group">
      <div class="btn" id="btnJump">▲</div>
      <div class="btn" id="btnAttack">⚡</div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    // Input States
    const keys = { left: false, right: false, up: false, attack: false };

    // Player Object
    const player = {
      x: 100, y: 0, width: 30, height: 50,
      vx: 0, vy: 0, speed: 5, jumpPower: -12,
      grounded: false, hp: 100, score: 0, facing: 1
    };

    const gravity = 0.6;
    const floorY = () => canvas.height - 80;

    // Entities Arrays
    let lasers = [];
    let enemies = [];

    // Controls Event Listeners (Keyboard)
    window.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
      if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
      if (e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') keys.up = true;
      if (e.key === 'z' || e.key === 'j') attack();
    });

    window.addEventListener('keyup', e => {
      if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
      if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
      if (e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') keys.up = false;
    });

    // Mobile Touch Controls
    function setupBtn(id, keyName) {
      const el = document.getElementById(id);
      el.addEventListener('touchstart', (e) => { e.preventDefault(); if(keyName==='attack') attack(); else keys[keyName] = true; });
      el.addEventListener('touchend', (e) => { e.preventDefault(); if(keyName!=='attack') keys[keyName] = false; });
    }
    setupBtn('btnLeft', 'left');
    setupBtn('btnRight', 'right');
    setupBtn('btnJump', 'up');
    setupBtn('btnAttack', 'attack');

    function attack() {
      lasers.push({
        x: player.x + (player.facing === 1 ? player.width : 0),
        y: player.y + 20,
        vx: player.facing * 12,
        length: 40
      });
    }

    function spawnEnemy() {
      if (Math.random() < 0.02) {
        enemies.push({
          x: canvas.width + 30,
          y: floorY() - 30,
          width: 30, height: 30,
          speed: 2 + Math.random() * 2,
          hp: 20
        });
      }
    }

    function update() {
      // Movement
      if (keys.left) { player.vx = -player.speed; player.facing = -1; }
      else if (keys.right) { player.vx = player.speed; player.facing = 1; }
      else { player.vx = 0; }

      if (keys.up && player.grounded) {
        player.vy = player.jumpPower;
        player.grounded = false;
      }

      player.vy += gravity;
      player.x += player.vx;
      player.y += player.vy;

      // Floor Collision
      if (player.y + player.height >= floorY()) {
        player.y = floorY() - player.height;
        player.vy = 0;
        player.grounded = true;
      }

      // Screen Boundaries
      if (player.x < 0) player.x = 0;
      if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;

      // Lasers Update
      lasers.forEach((l, index) => {
        l.x += l.vx;
        if (l.x < 0 || l.x > canvas.width) lasers.splice(index, 1);
      });

      // Enemies Update
      spawnEnemy();
      enemies.forEach((en, eIdx) => {
        en.x -= en.speed;

        // Hit by Laser
        lasers.forEach((l, lIdx) => {
          if (l.x < en.x + en.width && l.x + l.length > en.x && l.y > en.y && l.y < en.y + en.height) {
            en.hp -= 10;
            lasers.splice(lIdx, 1);
            if (en.hp <= 0) {
              enemies.splice(eIdx, 1);
              player.score += 10;
            }
          }
        });

        // Hit Player
        if (player.x < en.x + en.width && player.x + player.width > en.x &&
            player.y < en.y + en.height && player.y + player.height > en.y) {
          player.hp -= 1;
          if (player.hp <= 0) player.hp = 0;
        }
      });

      // Update UI
      document.getElementById('hp').innerText = player.hp;
      document.getElementById('score').innerText = player.score;
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Draw Floor
      ctx.strokeStyle = '#555';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(0, floorY());
      ctx.lineTo(canvas.width, floorY());
      ctx.stroke();

      // Draw MC (Jubah Siluet)
      ctx.fillStyle = '#e0e0e0';
      ctx.shadowBlur = 10;
      ctx.shadowColor = '#ffffff';
      
      // Kepala
      ctx.beginPath();
      ctx.arc(player.x + player.width/2, player.y + 10, 8, 0, Math.PI * 2);
      ctx.fill();
      // Jubah
      ctx.beginPath();
      ctx.moveTo(player.x + player.width/2, player.y + 15);
      ctx.lineTo(player.x, player.y + player.height);
      ctx.lineTo(player.x + player.width, player.y + player.height);
      ctx.closePath();
      ctx.fill();

      // Draw Lasers
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 4;
      lasers.forEach(l => {
        ctx.beginPath();
        ctx.moveTo(l.x, l.y);
        ctx.lineTo(l.x + (l.length * player.facing), l.y);
        ctx.stroke();
      });

      // Draw Enemies
      ctx.fillStyle = '#888888';
      enemies.forEach(en => {
        ctx.fillRect(en.x, en.y, en.width, en.height);
      });

      ctx.shadowBlur = 0; // Reset Glow
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
