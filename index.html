<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Narrow Dark Cave - Portrait Fixed</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: sans-serif; color: #fff; }

    /* Container Utama Khusus Mobile Portrait */
    #mainContainer {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
    }

    /* Arena Game di Bagian Atas */
    #gameArea {
      position: relative;
      width: 100%;
      height: 65vh; /* Arena game dinaikkan agar tidak tertutup tombol */
      background: #050505;
      border-bottom: 2px solid #fff;
    }

    #canvas { display: block; width: 100%; height: 100%; }

    /* Area Kontrol Khusus di Bagian Bawah */
    #controlArea {
      width: 100%;
      height: 35vh;
      background: #000;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 25px;
    }

    /* UI Bar Khas Narrow Dark Cave */
    #topUI {
      position: absolute; top: 12px; left: 12px; right: 12px;
      display: flex; justify-content: space-between; align-items: center;
      z-index: 10; pointer-events: none;
    }

    .hp-segments { display: flex; gap: 4px; border: 2px solid #fff; padding: 3px; background: rgba(0,0,0,0.6); }
    .hp-block { width: 12px; height: 10px; background: #fff; }
    .hp-block.empty { background: #222; }

    .center-info { display: flex; align-items: center; gap: 6px; }
    .skull-icon { font-size: 18px; }
    .boss-hp-bar { width: 130px; height: 10px; background: #222; border: 1.5px solid #fff; display: none; overflow: hidden; }
    .boss-hp-fill { height: 100%; background: #fff; width: 100%; }

    .score-txt { font-size: 14px; font-weight: bold; font-family: monospace; }

    /* Game Over Overlay */
    #gameOverScreen {
      display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.9); flex-direction: column; justify-content: center;
      align-items: center; z-index: 20; text-align: center;
    }
    #gameOverScreen h1 { font-size: 32px; margin-bottom: 8px; }
    #gameOverScreen button {
      margin-top: 12px; padding: 10px 25px; font-size: 16px; font-weight: bold;
      background: #fff; color: #000; border: none; border-radius: 4px; cursor: pointer;
    }

    /* Tombol Kontrol */
    .btn-group { display: flex; gap: 15px; }
    .btn {
      width: 58px; height: 58px; background: rgba(255,255,255,0.15); border: 2px solid rgba(255,255,255,0.8);
      border-radius: 50%; color: #fff; font-size: 22px; display: flex; align-items: center; justify-content: center;
      user-select: none; -webkit-tap-highlight-color: transparent;
    }
    .btn:active { background: rgba(255,255,255,0.6); transform: scale(0.92); }
  </style>
</head>
<body>

  <div id="mainContainer">
    <!-- Area Atas: Tempat Game Bertarung -->
    <div id="gameArea">
      <div id="topUI">
        <div class="hp-segments" id="hpSegments">
          <div class="hp-block"></div><div class="hp-block"></div><div class="hp-block"></div>
          <div class="hp-block"></div><div class="hp-block"></div><div class="hp-block"></div>
        </div>

        <div class="center-info">
          <span class="skull-icon">💀</span>
          <div class="boss-hp-bar" id="bossBar"><div class="boss-hp-fill" id="bossFill"></div></div>
        </div>

        <div class="score-txt">SCORE: <span id="scoreVal">0</span></div>
      </div>

      <div id="gameOverScreen">
        <h1 id="gameOverTitle">GAME OVER</h1>
        <p>Skor Akhir: <span id="finalScore">0</span></p>
        <button onclick="resetGame()">MAIN LAGI</button>
      </div>

      <canvas id="canvas"></canvas>
    </div>

    <!-- Area Bawah: Tombol Kontrol Pisah (Gak Nutupin Layar Game) -->
    <div id="controlArea">
      <div class="btn-group">
        <div class="btn" id="btnLeft">◄</div>
        <div class="btn" id="btnRight">►</div>
        <div class="btn" id="btnJump">▲</div>
      </div>
      <div class="btn-group">
        <div class="btn" id="btnAim">↗</div>
        <div class="btn" id="btnLaser">⚡</div>
      </div>
    </div>
  </div>

  <script>
    const gameArea = document.getElementById('gameArea');
    const cvs = document.getElementById('canvas');
    const ctx = cvs.getContext('2d');

    // Penyesuaian Ukuran Canvas Pas di Area Atas
    function resizeCanvas() {
      cvs.width = gameArea.clientWidth;
      cvs.height = gameArea.clientHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    let floor = cvs.height - 40;
    let isGameOver = false;

    // Player
    const player = {
      x: 50, y: 0, w: 22, h: 36,
      vx: 0, vy: 0, speed: 4, jump: -11,
      grounded: true, hp: 6, maxHp: 6, score: 0, dir: 1
    };

    const input = { left: false, right: false, aimUp: false };
    let activeLaserBeam = null;
    let bossAttacks = [];
    let monsters = [];
    let boss = null;
    let particles = [];

    // Control Binds
    function bindBtn(id, onPress, onRelease) {
      const el = document.getElementById(id);
      el.addEventListener('touchstart', (e) => { e.preventDefault(); onPress(); });
      el.addEventListener('touchend', (e) => { e.preventDefault(); if(onRelease) onRelease(); });
      el.addEventListener('mousedown', (e) => { e.preventDefault(); onPress(); });
      el.addEventListener('mouseup', (e) => { e.preventDefault(); if(onRelease) onRelease(); });
    }

    bindBtn('btnLeft', () => { input.left = true; player.dir = -1; }, () => input.left = false);
    bindBtn('btnRight', () => { input.right = true; player.dir = 1; }, () => input.right = false);
    bindBtn('btnJump', () => { if(player.grounded) { player.vy = player.jump; player.grounded = false; } });
    bindBtn('btnAim', () => input.aimUp = true, () => input.aimUp = false);
    bindBtn('btnLaser', () => fireLaserBeam());

    // FIRE LASER BEAM
    function fireLaserBeam() {
      if (isGameOver) return;

      const angle = input.aimUp ? (player.dir > 0 ? -Math.PI / 4 : -Math.PI * 0.75) : (player.dir > 0 ? 0 : Math.PI);
      
      activeLaserBeam = {
        startX: player.x + player.w / 2,
        startY: player.y + 14,
        angle: angle,
        timer: 12,
        dirX: player.dir,
        aimUp: input.aimUp
      };

      for(let i = 0; i < 15; i++) {
        particles.push({
          x: activeLaserBeam.startX,
          y: activeLaserBeam.startY,
          vx: (Math.random() - 0.5) * 10,
          vy: (Math.random() - 0.5) * 10,
          life: 10, color: '#fff'
        });
      }
    }

    function spawnLogic() {
      if (!boss && Math.random() < 0.015) {
        monsters.push({
          x: cvs.width + 10,
          y: cvs.height - 40 - 24,
          w: 24, h: 24,
          speed: 2,
          hp: 10
        });
      }

      // BOSS SPAWN DI SKOR 30
      if (player.score >= 30 && !boss) {
        boss = {
          x: cvs.width - 90,
          y: cvs.height - 40 - 80,
          w: 70, h: 70,
          hp: 80, maxHp: 80, // HP Boss disesuaikan agar mudah mati
          timer: 0, angle: 0
        };
        document.getElementById('bossBar').style.display = 'block';
      }
    }

    function resetGame() {
      isGameOver = false;
      player.hp = 6;
      player.score = 0;
      player.x = 50;
      monsters = [];
      bossAttacks = [];
      boss = null;
      activeLaserBeam = null;
      document.getElementById('bossBar').style.display = 'none';
      document.getElementById('gameOverScreen').style.display = 'none';
      loop();
    }

    function update() {
      if (isGameOver) return;

      floor = cvs.height - 40;

      // Movement
      player.vx = 0;
      if (input.left) player.vx = -player.speed;
      if (input.right) player.vx = player.speed;

      player.vy += 0.55;
      player.x += player.vx;
      player.y += player.vy;

      if (player.y + player.h >= floor) {
        player.y = floor - player.h;
        player.vy = 0;
        player.grounded = true;
      }

      if (player.x < 0) player.x = 0;
      if (player.x + player.w > cvs.width) player.x = cvs.width - player.w;

      // Update Partikel
      particles.forEach((p, idx) => {
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        if(p.life <= 0) particles.splice(idx, 1);
      });

      spawnLogic();

      // HITBOX LASER KE MONSTER & BOSS
      if (activeLaserBeam) {
        activeLaserBeam.timer--;

        let sx = activeLaserBeam.startX;
        let dir = activeLaserBeam.dirX;

        // Hit Monster
        for (let i = monsters.length - 1; i >= 0; i--) {
          let m = monsters[i];
          if ((dir > 0 && m.x >= sx) || (dir < 0 && m.x <= sx)) {
            monsters.splice(i, 1);
            player.score += 10;
          }
        }

        // Hit Boss (DAMAGE TINGGI: LANSUNG BERKURANG BANYAK)
        if (boss) {
          if ((dir > 0 && boss.x + boss.w >= sx) || (dir < 0 && boss.x <= sx)) {
            boss.hp -= 4; // Pengurangan HP sangat cepat

            // CEK PASTI MATI
            if (boss.hp <= 0) {
              boss = null; // Boss dihapus total dari memori
              player.score += 100;
              document.getElementById('bossBar').style.display = 'none';
            }
          }
        }

        if (activeLaserBeam && activeLaserBeam.timer <= 0) activeLaserBeam = null;
      }

      // Monster Move
      monsters.forEach((m, idx) => {
        m.x -= m.speed;
        if (player.x < m.x + m.w && player.x + player.w > m.x &&
            player.y < m.y + m.h && player.y + player.h > m.y) {
          player.hp -= 1;
          monsters.splice(idx, 1);
        }
      });

      // Boss Behavior
      if (boss) {
        boss.angle += 0.05;
        boss.y = (floor - 90) + Math.sin(boss.angle) * 20;

        boss.timer++;
        if (boss.timer > 70) {
          boss.timer = 0;
          let dx = (player.x + player.w/2) - (boss.x + boss.w/2);
          let dy = (player.y + player.h/2) - (boss.y + boss.h/2);
          let dist = Math.sqrt(dx*dx + dy*dy);

          bossAttacks.push({
            x: boss.x + boss.w/2,
            y: boss.y + boss.h/2,
            vx: (dx / dist) * 5.5,
            vy: (dy / dist) * 5.5
          });
        }

        const pct = Math.max(0, (boss.hp / boss.maxHp) * 100);
        document.getElementById('bossFill').style.width = pct + '%';
      }

      // Boss Attack Move & Hit
      bossAttacks.forEach((atk, idx) => {
        atk.x += atk.vx;
        atk.y += atk.vy;

        if (atk.x > player.x && atk.x < player.x + player.w &&
            atk.y > player.y && atk.y < player.y + player.h) {
          player.hp -= 1;
          bossAttacks.splice(idx, 1);
        }
      });

      // UI HP Segments
      const hpBlocks = document.querySelectorAll('#hpSegments .hp-block');
      hpBlocks.forEach((blk, idx) => {
        if (idx < player.hp) blk.classList.remove('empty');
        else blk.classList.add('empty');
      });

      document.getElementById('scoreVal').innerText = player.score;

      if (player.hp <= 0) {
        player.hp = 0;
        isGameOver = true;
        document.getElementById('finalScore').innerText = player.score;
        document.getElementById('gameOverScreen').style.display = 'flex';
      }
    }

    function render() {
      ctx.clearRect(0, 0, cvs.width, cvs.height);

      // Lantai Arena
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(0, floor);
      ctx.lineTo(cvs.width, floor);
      ctx.stroke();

      // Render Player
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(player.x + player.w/2, player.y + 7, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(player.x + player.w/2, player.y + 10);
      ctx.lineTo(player.x, player.y + player.h);
      ctx.lineTo(player.x + player.w, player.y + player.h);
      ctx.fill();

      // LASER BEAM VISUAL
      if (activeLaserBeam) {
        let sx = activeLaserBeam.startX;
        let sy = activeLaserBeam.startY;
        let angle = activeLaserBeam.angle;
        let ex = sx + Math.cos(angle) * cvs.width * 2;
        let ey = sy + Math.sin(angle) * cvs.width * 2;

        ctx.save();
        ctx.shadowBlur = 15;
        ctx.shadowColor = '#ffffff';

        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 10;
        ctx.beginPath();
        ctx.moveTo(sx, sy);
        ctx.lineTo(ex, ey);
        ctx.stroke();

        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(sx, sy, 10, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }

      // Partikel
      particles.forEach(p => {
        ctx.fillStyle = p.color || '#fff';
        ctx.fillRect(p.x, p.y, 3, 3);
      });

      // Monster Biasa
      ctx.fillStyle = '#aaa';
      monsters.forEach(m => ctx.fillRect(m.x, m.y, m.w, m.h));

      // Boss Monster
      if (boss) {
        ctx.fillStyle = '#fff';
        ctx.fillRect(boss.x, boss.y, boss.w, boss.h);

        // Tanduk Boss
        ctx.beginPath();
        ctx.moveTo(boss.x + 10, boss.y);
        ctx.lineTo(boss.x - 10, boss.y - 20);
        ctx.lineTo(boss.x + 25, boss.y);
        ctx.fill();
      }

      // Peluru Serangan Boss
      ctx.fillStyle = '#fff';
      bossAttacks.forEach(atk => {
        ctx.beginPath();
        ctx.arc(atk.x, atk.y, 5, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    function loop() {
      update();
      render();
      if (!isGameOver) requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
