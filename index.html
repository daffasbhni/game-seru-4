<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Laser Arena - Fixed Mechanics</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; }
    body { background: #000; color: #fff; font-family: sans-serif; overflow: hidden; }
    #canvas { display: block; background: #0a0a0a; }
    
    #ui { position: absolute; top: 12px; left: 15px; font-size: 16px; font-weight: bold; z-index: 5; text-shadow: 0 0 5px #fff; }
    #gameOverScreen { display: none; position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.85); color: #fff; flex-direction: column; align-items: center; justify-content: center; z-index: 20; }
    #gameOverScreen button { margin-top: 15px; padding: 12px 25px; font-size: 18px; font-weight: bold; background: #fff; color: #000; border: none; border-radius: 20px; cursor: pointer; }

    .controls { position: absolute; bottom: 20px; width: 100%; display: flex; justify-content: space-between; padding: 0 20px; z-index: 10; }
    .btn-group { display: flex; gap: 10px; }
    .btn { width: 55px; height: 55px; background: rgba(255,255,255,0.25); border: 2px solid #fff; border-radius: 50%; color: #fff; font-size: 20px; display: flex; align-items: center; justify-content: center; user-select: none; }
    .btn:active { background: rgba(255,255,255,0.6); }
  </style>
</head>
<body>

  <div id="ui">HP: <span id="hpText">100</span> | SCORE: <span id="scoreText">0</span></div>

  <div id="gameOverScreen">
    <h1>GAME OVER</h1>
    <p>Skor Kamu: <span id="finalScore">0</span></p>
    <button onclick="resetGame()">MAIN LAGI</button>
  </div>

  <canvas id="canvas"></canvas>

  <div class="controls">
    <div class="btn-group">
      <div class="btn" id="btnLeft">◄</div>
      <div class="btn" id="btnRight">►</div>
      <div class="btn" id="btnJump">▲</div>
    </div>
    <div class="btn-group">
      <div class="btn" id="btnAim">↗</div>
      <div class="btn" id="btnLaser">⚡</div>
    </div>
  </div>

  <script>
    const cvs = document.getElementById('canvas');
    const ctx = cvs.getContext('2d');

    cvs.width = window.innerWidth;
    cvs.height = window.innerHeight;

    const floor = cvs.height - 60;
    let isGameOver = false;

    // Player (MC)
    const player = {
      x: 100, y: floor - 45, w: 30, h: 45,
      vx: 0, vy: 0, speed: 4, jump: -11,
      grounded: true, hp: 100, maxHp: 100, score: 0, dir: 1
    };

    const input = { left: false, right: false, aimUp: false };
    let activeLasers = [];
    let monsterList = [];
    let bossMonster = null;

    // Setup Event Tombol Layar
    function attachControl(id, onPress, onRelease) {
      const el = document.getElementById(id);
      el.addEventListener('touchstart', (e) => { e.preventDefault(); onPress(); });
      el.addEventListener('touchend', (e) => { e.preventDefault(); if(onRelease) onRelease(); });
      el.addEventListener('mousedown', (e) => { e.preventDefault(); onPress(); });
      el.addEventListener('mouseup', (e) => { e.preventDefault(); if(onRelease) onRelease(); });
    }

    attachControl('btnLeft', () => { input.left = true; player.dir = -1; }, () => input.left = false);
    attachControl('btnRight', () => { input.right = true; player.dir = 1; }, () => input.right = false);
    attachControl('btnJump', () => { if(player.grounded) { player.vy = player.jump; player.grounded = false; } });
    attachControl('btnAim', () => input.aimUp = true, () => input.aimUp = false);
    attachControl('btnLaser', () => fireLaser());

    // Keyboard Control
    window.addEventListener('keydown', e => {
      if (isGameOver) return;
      if (e.key === 'a' || e.key === 'ArrowLeft') { input.left = true; player.dir = -1; }
      if (e.key === 'd' || e.key === 'ArrowRight') { input.right = true; player.dir = 1; }
      if (e.key === 'w' || e.key === 'ArrowUp') { if(player.grounded) { player.vy = player.jump; player.grounded = false; } }
      if (e.key === 'Shift') input.aimUp = true;
      if (e.key === ' ' || e.key === 'j') fireLaser();
    });

    window.addEventListener('keyup', e => {
      if (e.key === 'a' || e.key === 'ArrowLeft') input.left = false;
      if (e.key === 'd' || e.key === 'ArrowRight') input.right = false;
      if (e.key === 'Shift') input.aimUp = false;
    });

    // Mekanik Laser Beam
    function fireLaser() {
      if (isGameOver) return;
      
      let speedX = player.dir * 18;
      let speedY = input.aimUp ? -12 : 0;
      if (input.aimUp) speedX = player.dir * 12;

      activeLasers.push({
        x: player.x + player.w / 2,
        y: player.y + 15,
        vx: speedX,
        vy: speedY,
        width: 60, // Panjang balok laser
        height: 6, // Tebal balok laser
        duration: 25
      });
    }

    function spawnMonsters() {
      // Spawn Monster Kecil
      if (!bossMonster && Math.random() < 0.012) {
        monsterList.push({
          x: cvs.width + 10,
          y: floor - 30,
          w: 30, h: 30,
          speed: 1.5,
          hp: 20
        });
      }

      // Spawn Boss
      if (player.score >= 50 && !bossMonster) {
        bossMonster = {
          x: cvs.width - 120,
          y: floor - 90,
          w: 90, h: 90,
          hp: 200, maxHp: 200
        };
      }
    }

    function resetGame() {
      isGameOver = false;
      player.hp = 100;
      player.score = 0;
      player.x = 100;
      player.y = floor - player.h;
      activeLasers = [];
      monsterList = [];
      bossMonster = null;
      document.getElementById('gameOverScreen').style.display = 'none';
      gameLoop();
    }

    function update() {
      if (isGameOver) return;

      // MOMENTUM PLAYER (Diam jika tombol lepas)
      player.vx = 0;
      if (input.left) player.vx = -player.speed;
      if (input.right) player.vx = player.speed;

      player.vy += 0.55; // Gravitasi
      player.x += player.vx;
      player.y += player.vy;

      // Batas Lantai
      if (player.y + player.h >= floor) {
        player.y = floor - player.h;
        player.vy = 0;
        player.grounded = true;
      }

      // Batas Layar
      if (player.x < 0) player.x = 0;
      if (player.x + player.w > cvs.width) player.x = cvs.width - player.w;

      // Pergerakan Laser
      activeLasers.forEach((laser, index) => {
        laser.x += laser.vx;
        laser.y += laser.vy;
        laser.duration--;
        if (laser.duration <= 0 || laser.x > cvs.width || laser.x < 0) {
          activeLasers.splice(index, 1);
        }
      });

      spawnMonsters();

      // Logika Monster Kecil & Kena Tembak
      monsterList.forEach((mon, mIdx) => {
        mon.x -= mon.speed;

        // Deteksi Laser Kena Monster
        activeLasers.forEach((laser, lIdx) => {
          if (laser.x + laser.width > mon.x &&
              laser.x < mon.x + mon.w &&
              laser.y + laser.height > mon.y &&
              laser.y < mon.y + mon.h) {
            
            mon.hp -= 20; // Monster langsung mati / berkurang darah
            activeLasers.splice(lIdx, 1);

            if (mon.hp <= 0) {
              monsterList.splice(mIdx, 1);
              player.score += 10;
            }
          }
        });

        // Tabrakan Monster ke Player
        if (player.x < mon.x + mon.w && player.x + player.w > mon.x &&
            player.y < mon.y + mon.h && player.y + player.h > mon.y) {
          player.hp -= 0.5;
        }
      });

      // Logika Boss Monster
      if (bossMonster) {
        activeLasers.forEach((laser, lIdx) => {
          if (laser.x + laser.width > bossMonster.x &&
              laser.x < bossMonster.x + bossMonster.w &&
              laser.y + laser.height > bossMonster.y &&
              laser.y < bossMonster.y + bossMonster.h) {
            
            bossMonster.hp -= 8;
            activeLasers.splice(lIdx, 1);

            if (bossMonster.hp <= 0) {
              bossMonster = null;
              player.score += 100;
            }
          }
        });
      }

      // Check Game Over
      if (player.hp <= 0) {
        player.hp = 0;
        isGameOver = true;
        document.getElementById('finalScore').innerText = player.score;
        document.getElementById('gameOverScreen').style.display = 'flex';
      }

      // UI Update
      document.getElementById('hpText').innerText = Math.ceil(player.hp);
      document.getElementById('scoreText').innerText = player.score;
    }

    function render() {
      ctx.clearRect(0, 0, cvs.width, cvs.height);

      // Garis Lantai
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, floor);
      ctx.lineTo(cvs.width, floor);
      ctx.stroke();

      // Render Player (MC Jubah Silver)
      ctx.fillStyle = '#e0e0e0';
      ctx.beginPath();
      ctx.arc(player.x + player.w/2, player.y + 10, 7, 0, Math.PI * 2); // Kepala
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(player.x + player.w/2, player.y + 14);
      ctx.lineTo(player.x, player.y + player.h);
      ctx.lineTo(player.x + player.w, player.y + player.h);
      ctx.fill(); // Jubah

      // Render Laser Balok Ber-Glow
      activeLasers.forEach(laser => {
        ctx.save();
        ctx.shadowBlur = 12;
        ctx.shadowColor = '#ffffff';
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(laser.x, laser.y, laser.width, laser.height);
        ctx.restore();
      });

      // Render Monster Kecil
      ctx.fillStyle = '#888';
      monsterList.forEach(mon => {
        ctx.fillRect(mon.x, mon.y, mon.w, mon.h);
      });

      // Render Boss Monster + Darah
      if (bossMonster) {
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(bossMonster.x, bossMonster.y, bossMonster.w, bossMonster.h);

        // Tanduk Boss
        ctx.beginPath();
        ctx.moveTo(bossMonster.x, bossMonster.y);
        ctx.lineTo(bossMonster.x - 15, bossMonster.y - 20);
        ctx.lineTo(bossMonster.x + 20, bossMonster.y);
        ctx.fill();

        // Bar Darah Boss
        ctx.fillStyle = 'red';
        ctx.fillRect(bossMonster.x, bossMonster.y - 15, (bossMonster.hp / bossMonster.maxHp) * bossMonster.w, 6);
      }
    }

    function gameLoop() {
      update();
      render();
      if (!isGameOver) requestAnimationFrame(gameLoop);
    }

    gameLoop();
  </script>
</body>
</html>
